name: SLA Cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SLA breach check
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.SLA_API_URL }}/internal/maintenance/sla-check" \
            -H "X-Cron-Secret: ${{ secrets.SLA_CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "SLA check failed with status $status"
            exit 1
          fi
