name: SLA Cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SLA breach check
        run: |
          # Normalize SLA_API_URL defensively: tolerate a missing scheme
          # (default to https, since that's all Railway serves) and a
          # trailing slash, so a re-typed secret can't silently regress
          # this into a redirect loop like it did the first time.
          url="${{ secrets.SLA_API_URL }}"
          case "$url" in
            http://*|https://*) ;;
            *) url="https://$url" ;;
          esac
          url="${url%/}"

          target="$url/internal/maintenance/sla-check"
          status=$(curl -s -D /tmp/headers.txt -o /tmp/response.json -w "%{http_code}" -X POST \
            "$target" \
            -H "X-Cron-Secret: ${{ secrets.SLA_CRON_SECRET }}")
          echo "HTTP status: $status"
          echo "--- response headers ---"
          cat /tmp/headers.txt
          echo "--- response body ---"
          cat /tmp/response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "SLA check failed with status $status"
            exit 1
          fi
